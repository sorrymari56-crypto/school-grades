<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarFlow — Birmingham City Schools SIS & Gradebook</title>
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #090d16;
      --card: #1e293b;
      --card-hover: #263449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Auth / Login Screen */
    .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 65%); }
    .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; max-width: 440px; width: 100%; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .auth-logo { font-size: 24px; font-weight: 800; color: #818cf8; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .auth-logo span { background: var(--accent); color: white; font-size: 11px; padding: 2px 7px; border-radius: 6px; }
    .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; padding: 5px; border-radius: 10px; margin: 20px 0; border: 1px solid var(--border); }
    .role-tab { background: transparent; border: none; color: var(--muted); padding: 10px; border-radius: 7px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.15s; }
    .role-tab.active { background: var(--accent); color: white; }
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
    .demo-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .demo-pill { background: #0f172a; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
    .demo-pill:hover { border-color: var(--accent); color: white; }

    /* Shared App Layout */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 14px; flex-shrink: 0; }
    .brand { font-size: 20px; font-weight: 800; color: #818cf8; letter-spacing: -0.5px; padding: 0 10px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .brand span { background: var(--accent); color: white; font-size: 11px; padding: 2px 6px; border-radius: 6px; }
    .nav-btn { background: transparent; border: none; color: var(--muted); text-align: left; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; transition: 0.15s; }
    .nav-btn:hover { background: var(--card); color: var(--text); }
    .nav-btn.active { background: var(--accent); color: white; }
    .sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
    .reset-btn { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .reset-btn:hover { border-color: var(--red); color: var(--red); }

    .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
    .topbar { background: var(--sidebar); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .class-picker { display: flex; align-items: center; gap: 10px; }
    select, input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
    .topbar select, .panel select, .panel input { width: auto; }
    select:focus, input:focus { border-color: var(--accent); }
    .btn { background: var(--accent); color: white; border: none; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-outline { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--card-hover); }
    .btn-green { background: var(--green); color: #052e16; }

    .content { padding: 26px 28px; max-width: 1250px; width: 100%; }

    /* Stats & Panels */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .stat-val { font-size: 24px; font-weight: 800; margin-top: 4px; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(15, 23, 42, 0.6); color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* Inputs & Badges */
    .score-input { width: 64px !important; text-align: center; padding: 6px; font-weight: 600; background: #0f172a; }
    .badge { padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-block; }
    .b-green { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .b-yellow { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
    .b-red { background: rgba(239, 68, 68, 0.18); color: #f87171; }
    .cat-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; display: inline-block; margin-top: 3px; }

    /* Cards Grid */
    .assign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 20px; }
    .assign-card { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

    /* Student Class Cards */
    .student-class-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .sc-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }

    /* Modals */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; max-width: 520px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .row-between { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(51,65,85,0.5); font-size: 13px; }

    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; align-items: center; padding: 10px; }
      .brand { border: none; padding: 0 12px 0 0; margin: 0; }
      .sidebar-footer { display: none; }
    }
    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      body, .modal { background: white; color: black; }
    }
  </style>
</head>
<body>

  <!-- ==================== 1. SIGN-IN PORTAL ==================== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">ScholarFlow <span>BCS</span></div>
      <p style="font-size:13px; color:var(--muted);">Birmingham City Schools • Unified Gradebook & Student Portal</p>

      <div class="role-tabs">
        <button id="tabRoleStudent" class="role-tab active" onclick="setLoginRole('student')">Student Sign In</button>
        <button id="tabRoleTeacher" class="role-tab" onclick="setLoginRole('teacher')">Teacher Portal</button>
      </div>

      <div id="loginError" class="error-msg"></div>

      <!-- Student Login Form -->
      <div id="studentLoginForm">
        <div class="field-group">
          <label class="field-label">District Student Email (@bhm.k12.al.us)</label>
          <input id="studentEmailInput" type="email" placeholder="firstname.lastname@bhm.k12.al.us" onkeydown="if(event.key==='Enter') handleStudentLogin()">
        </div>
